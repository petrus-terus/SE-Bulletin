<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" id="app-theme-color" content="#F5F7FA" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('sesb_theme') || 'system';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById('app-theme-color');
          if (meta) {
            meta.setAttribute('content', isDark ? '#0B0F17' : '#F5F7FA');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Sabah Electricity Internal Corporate Bulletin & Social Communication PWA" />
    <title>SE-Connect</title>

    <!-- PWA Mobile Standalone & Touch Icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SE-Connect" />
    <link rel="apple-touch-icon" href="/sesb_app_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/sesb_app_icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/sesb_app_icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/sesb_app_icon.png" />

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Google Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
